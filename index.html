<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Editor</title>
<meta name="description" content="A visual editor for your team's website. Open your site, change it like a design file, and download the updated version.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F05A28'/%3E%3Cpath d='M9 22h14M9 10h14M9 16h9' stroke='%231A1A1A' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="editor.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<section id="welcome" class="welcome">
  <div class="welcome-card">
    <div class="brand"><span class="logo">Se</span><span>Site Editor</span></div>
    <h1>Open your site to start editing</h1>
    <p>Pick the folder your website lives in, or a ZIP of it. Nothing gets uploaded anywhere: everything stays in this browser until you download it.</p>
    <div class="welcome-actions">
      <label class="btn btn-primary btn-lg">Choose site folder<input id="openFolder" type="file" webkitdirectory multiple hidden></label>
      <label class="btn btn-lg">Open a ZIP<input id="openZip" type="file" accept=".zip" hidden></label>
    </div>
    <button id="resumeBtn" class="btn btn-ghost" hidden>Continue where you left off</button>
    <p id="welcomeError" class="error" role="alert" hidden></p>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="menubar">
    <span class="logo" aria-hidden="true">Se</span>
    <nav class="menus" id="menus" aria-label="Menu"></nav>
    <span class="spacer"></span>
    <span id="saveState" class="save-state">Saved in this browser</span>
    <div class="seg" role="group" aria-label="Screen size" id="deviceSeg">
      <button data-cmd="viewDesktop" data-dev="desktop" title="Desktop" aria-label="Desktop"><svg viewBox="0 0 24 24"><path d="M2 4h20v13H2z M8 21h8 M12 17v4"/></svg></button>
      <button data-cmd="viewTablet" data-dev="tablet" title="Tablet: changes here only apply to tablets and phones" aria-label="Tablet"><svg viewBox="0 0 24 24"><path d="M5 2h14v20H5z M11 18h2"/></svg></button>
      <button data-cmd="viewPhone" data-dev="phone" title="Phone: changes here only apply to phones" aria-label="Phone"><svg viewBox="0 0 24 24"><path d="M7 2h10v20H7z M11 18h2"/></svg></button>
    </div>
    <button class="icon-btn" data-cmd="toggleTheme" title="Switch light / dark" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"><path d="M12 4V2 M12 22v-2 M4 12H2 M22 12h-2 M5 5l1.5 1.5 M17.5 17.5L19 19 M5 19l1.5-1.5 M17.5 6.5L19 5 M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg></button>
    <button class="btn" data-cmd="preview" id="previewBtn">Preview</button>
    <button class="btn btn-primary" data-cmd="download"><svg viewBox="0 0 24 24"><path d="M12 3v12 M7 10l5 5 5-5 M4 21h16"/></svg>Download<span id="changeCount" class="count" hidden></span></button>
  </header>

  <div id="optbar" class="optbar"></div>

  <div class="workspace">
    <nav class="tools" id="tools" aria-label="Tools"></nav>

    <main class="stage-col">
      <div id="docTabs" class="doc-tabs"></div>
      <div class="stage-grid">
        <span class="ruler-corner"></span>
        <canvas id="rulerH" class="ruler ruler-h" aria-hidden="true"></canvas>
        <canvas id="rulerV" class="ruler ruler-v" aria-hidden="true"></canvas>
        <div class="stage" id="stage">
          <div id="frameBox" class="frame-box"><iframe id="frame" title="Page being edited"></iframe></div>
          <div id="ctxBar" class="ctx-bar" hidden></div>
        </div>
      </div>
      <section id="timeline" class="timeline" hidden></section>
      <div class="statusbar">
        <button id="zoomBtn" class="status-btn">100%</button>
        <span id="statusDev">Desktop</span>
        <span id="statusSel">Nothing selected</span>
        <span class="spacer"></span>
        <span id="statusTip"></span>
      </div>
    </main>

    <aside class="dock" id="dock" aria-label="Panels"></aside>
  </div>
</div>

<div id="ctxMenu" class="ctx" role="menu" hidden></div>
<div id="flyout" class="ctx" role="menu" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="runtime.js"></script>
<script src="core.js"></script>
<script src="canvas.js"></script>
<script src="panels.js"></script>
<script src="io.js"></script>
</body>
</html>
